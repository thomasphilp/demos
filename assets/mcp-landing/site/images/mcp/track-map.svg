<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" font-family="Helvetica, Arial, sans-serif">
<defs>
<pattern id="streets" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-3)">
<path d="M0 0.5H13M0.5 0V13" stroke="#fff" stroke-width="1"/>
</pattern>
<filter id="relief" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="7"/>
<feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.56  0 0 0 0 0.38  0 0 0 0.9 -0.25"/>
<feComposite in2="SourceGraphic" operator="in"/>
</filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
</filter>
<g id="shield">
<path d="M-9 -9.5Q0 -12 9 -9.5V0Q9 7 0 10.5Q-9 7 -9 0Z" fill="#2a5db0" stroke="#fff" stroke-width="1.5"/>
<path d="M-8.2 -8.8Q0 -11 8.2 -8.8V-5.5H-8.2Z" fill="#d23b33"/>
</g>
<g id="state">
<rect x="-10" y="-8" width="20" height="16" rx="3" fill="#fff" stroke="#6b6b6b" stroke-width="1.2"/>
</g>
</defs>

<rect width="680" height="264" fill="#ece9e2"/>
<rect width="680" height="264" fill="url(#streets)" opacity="0.75"/>

